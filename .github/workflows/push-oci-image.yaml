---
name: Push OCI Image
on:
  workflow_call:
    inputs:
      image-name:
        description: 'Base name for the OCI image (e.g., bluefin-wallpapers)'
        required: true
        type: string
      release-tag:
        description: 'Release tag to use for the image'
        required: true
        type: string
      flavors:
        description: 'JSON array of flavors to build (e.g., ["gnome", "kde", "macos", "png"]). Use [""] for single image.'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact to download'
        required: false
        type: string
        default: 'packaging-artifacts'

jobs:
  push-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: ${{ fromJson(inputs.flavors) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: .

      - name: Debug - Analyze File Type
        run: |
          echo "Current directory:"
          pwd
          echo "Files size check:"
          ls -lah
          
          echo "Checking file magic numbers (signatures):"
          # 'file' command determines type by content, not extension
          # We use find to safely pass the filename to the file command
          find . -name "*.tar.zstd" -exec file {} \;

      - name: Install zstd
        # Still useful to have installed just in case tar auto-detects it actually IS zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Extract tarball
        run: |
          mkdir content
          
          # 1. Determine the filename based on flavor
          if [ -z "${{ matrix.flavor }}" ]; then
            TARGET_FILE="${{ inputs.image-name }}.tar.zstd"
          else
            TARGET_FILE="${{ inputs.image-name }}-${{ matrix.flavor }}.tar.zstd"
          fi
          
          echo "Targeting file: $TARGET_FILE"
          
          # 2. Extract using Auto-Detection
          # We removed '-I zstd'. 
          # GNU Tar will inspect the file header. 
          # - If it's GZIP, it handles it. 
          # - If it's ZSTD, it handles it (since we installed zstd above).
          # - If it's uncompressed, it handles it.
          tar -xf "$TARGET_FILE" -C content

      - name: Create Dockerfile
        run: |
          echo "FROM scratch" > Dockerfile
          echo "COPY content /usr/share/backgrounds/${{ inputs.image-name }}/" >> Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Using format() allows for cleaner logic than conditional strings
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/${{ inputs.image-name }}${{ matrix.flavor != '' && format('-{0}', matrix.flavor) || '' }}:${{ inputs.release-tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/${{ inputs.image-name }}${{ matrix.flavor != '' && format('-{0}', matrix.flavor) || '' }}:latest
          file: Dockerfile
