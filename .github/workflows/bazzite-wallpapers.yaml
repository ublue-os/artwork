---
name: Bazzite Wallpapers
on:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release for Bazzite Wallpapers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      container_tag: ${{ steps.tag.outputs.container_tag }}
    # We need a newish version of kimageformats, 24.04 doesn't have it
    container: docker.io/library/ubuntu:plucky-20251001@sha256:27771fb7b40a58237c98e8d3e6b9ecdd9289cec69a857fccfb85ff36294dac20

    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Create tarball
        shell: bash
        run: |
          mkdir -p output/packaging/
          cp -R wallpapers/bazzite/* output/packaging/
          cd output/packaging && tar -acvf bazzite-wallpapers.tar.zstd *

      - name: Determine tag
        id: tag
        run: |
          DATE_SUFFIX="$(date --iso-8601=date)"
          echo "tag=bazzite-v${DATE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "container_tag=v${DATE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: packaging-artifacts
          path: output/packaging/

      - name: Publish release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag:   ${{ steps.tag.outputs.tag }}
          allowUpdates: true
          name:  "${{ steps.tag.outputs.tag }}"
          artifacts: "output/packaging/bazzite-wallpapers.tar.zstd"
          token: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    needs: create-release
    uses: ./.github/workflows/push-oci-image.yaml
    with:
      image-name: bazzite-wallpapers
      release-tag: ${{ needs.create-release.outputs.container_tag }}
      flavors: '[""]'
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
