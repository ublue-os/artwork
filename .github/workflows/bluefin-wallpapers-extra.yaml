---
name: Bluefin Wallpapers Extra
on:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release for Bluefin Wallpapers with Gnome and KDE support
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      container_tag: ${{ steps.tag.outputs.container_tag }}
    # We need a newish version of kimageformats, 24.04 doesn't have it
    container: docker.io/library/ubuntu:26.04@sha256:f3d28607ddd78734bb7f71f117f3c6706c666b8b76cbff7c9ff6e5718d46ff64

    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Create tarballs
        shell: bash
        run: |
          # Create separate archives for each platform
          mkdir -p output/packaging/macos
          mkdir -p output/packaging/kde
          mkdir -p output/packaging/gnome/images
          mkdir -p output/packaging/png
          
          # Process all extra wallpapers
          for wp in "dusk" "prey" "huntress" "tenacious-pterosaur" "leaf-collector" "duality" "eyes" "lazy-days"; do
            # macOS: HEIC dynamic wallpapers
            cp wallpapers/$wp/macos/*.heic output/packaging/macos/ 2>/dev/null || true
            
            # KDE: AVIF wallpapers
            cp wallpapers/$wp/kde/*.avif output/packaging/kde/ 2>/dev/null || true
            
            # GNOME: SVG or JXL wallpapers + XML metadata
            cp wallpapers/$wp/*.{svg,jxl,xml} output/packaging/gnome/images/ 2>/dev/null || true
            cp -R wallpapers/$wp/gnome/gnome-background-properties output/packaging/gnome/ 2>/dev/null || true
            
            # PNG: For other desktops
            cp wallpapers/$wp/macos/*.png output/packaging/png/ 2>/dev/null || true
          done
          
          # Create archives
          cd output/packaging/macos && tar -acvf ../bluefin-wallpapers-extra-macos.tar.zstd *.heic && cd -
          cd output/packaging/kde && tar -acvf ../bluefin-wallpapers-extra-kde.tar.zstd *.avif && cd -
          cd output/packaging/gnome && tar -acvf ../bluefin-wallpapers-extra-gnome.tar.zstd * && cd -
          cd output/packaging/png && tar -acvf ../bluefin-wallpapers-extra-png.tar.zstd *.png && cd -

      - name: Determine tag
        id: tag
        run: |
          DATE_SUFFIX="$(date --iso-8601=date)"
          echo "tag=bluefin-extra-v${DATE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "container_tag=v${DATE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: packaging-artifacts
          path: output/packaging/

      - name: Publish release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag:   ${{ steps.tag.outputs.tag }}
          allowUpdates: true
          name:  "${{ steps.tag.outputs.tag }}"
          artifacts: "output/packaging/bluefin-wallpapers-extra-*.tar.zstd"
          token: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    needs: create-release
    uses: ./.github/workflows/push-oci-image.yaml
    with:
      image-name: bluefin-wallpapers-extra
      release-tag: ${{ needs.create-release.outputs.container_tag }}
      flavors: '["gnome", "kde", "macos", "png"]'
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
