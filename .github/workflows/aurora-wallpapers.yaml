---
name: Aurora Wallpapers
on:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release for Aurora Wallpapers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # We need a newish version of kimageformats, 24.04 doesn't have it
    container: docker.io/library/ubuntu:25.04@sha256:103c7471649a4fd9996fe73dff20f46082e4e0f0f6240c91954b8b09c38b6faf

    steps:

      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          fetch-depth: 0
      - name: Create tarball
        shell: bash
        run: |
          mkdir -p output/packaging/kde/
          cp -R wallpapers/aurora/* output/packaging/kde/
          cd output/packaging && tar -acvf aurora-wallpapers.tar.zstd *

      - name: Determine tag
        id: tag
        run: echo "tag=aurora-v$(date --iso-8601=date)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-artifacts
          path: output/packaging/

      - name: Publish release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1
        with:
          tag:   ${{ steps.tag.outputs.tag }}
          allowUpdates: false
          name:  "${{ steps.tag.outputs.tag }}"
          artifacts: "output/packaging/aurora-wallpapers.tar.zstd"
          token: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaging-artifacts
          path: .

      - name: Extract tarball
        run: |
          mkdir content
          tar --zstd -xf aurora-wallpapers.tar.zstd -C content

      - name: Create Dockerfile
        run: |
          echo "FROM scratch" > Dockerfile
          echo "COPY content /usr/share/backgrounds/aurora-wallpapers/" >> Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/aurora-wallpapers:${{ needs.create-release.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/aurora-wallpapers:latest
          file: Dockerfile
