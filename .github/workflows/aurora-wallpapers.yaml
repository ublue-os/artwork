---
name: Aurora Wallpapers
on:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release for Aurora Wallpapers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      container_tag: ${{ steps.tag.outputs.container_tag }}
    # We need a newish version of kimageformats, 24.04 doesn't have it
    container: docker.io/library/ubuntu:plucky-20251001@sha256:27771fb7b40a58237c98e8d3e6b9ecdd9289cec69a857fccfb85ff36294dac20

    steps:

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
      - name: Create tarball
        shell: bash
        run: |
          mkdir -p output/packaging/kde/
          cp -R wallpapers/aurora/* output/packaging/kde/
          cd output/packaging && tar -acvf aurora-wallpapers.tar.zstd *

      - name: Determine tag
        id: tag
        run: |
          DATE_SUFFIX="$(date --iso-8601=date)"
          echo "tag=aurora-v${DATE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "container_tag=v${DATE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: packaging-artifacts
          path: output/packaging/

      - name: Publish release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1
        with:
          tag:   ${{ steps.tag.outputs.tag }}
          allowUpdates: true
          name:  "${{ steps.tag.outputs.tag }}"
          artifacts: "output/packaging/aurora-wallpapers.tar.zstd"
          token: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    needs: create-release
    uses: ./.github/workflows/push-oci-image.yaml
    with:
      image-name: aurora-wallpapers
      release-tag: ${{ needs.create-release.outputs.container_tag }}
      flavors: '[""]'
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
